services:
  - type: web
    name: gta-transit-live
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run prefetch
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
      - key: STATIC_MAX_AGE_DAYS
        value: "30"
      # 限制 V8 堆，解析 TTC 线路走向时及时回收，留在 512MB 内
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: APP_PASSWORD
        sync: false
      # 账号模式：两项都要在 Render 后台手动设置。SESSION_SECRET 用 `openssl rand -base64 48` 生成；ACCOUNTS 设为 1 开启
      - key: SESSION_SECRET
        sync: false
      - key: ACCOUNTS
        sync: false
      - key: GO_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NOTIFY_SECRET
        sync: false
      - key: VAPID_SUBJECT
        value: https://github.com/mrgreedcp-spec/gta-transit-live
